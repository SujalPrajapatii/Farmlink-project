<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Assorted pulses and lentils</title>
  <desc id="description">A top-down bowl filled with green, red, yellow, and brown pulses.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8eed3"/>
      <stop offset="1" stop-color="#d6a767"/>
    </linearGradient>
    <radialGradient id="bowl">
      <stop stop-color="#fffdf5"/>
      <stop offset=".72" stop-color="#f5dfb8"/>
      <stop offset="1" stop-color="#ad6e38"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6a3d1e" flood-opacity=".35"/>
    </filter>
    <pattern id="lentils" width="92" height="82" patternUnits="userSpaceOnUse" patternTransform="rotate(-10)">
      <ellipse cx="14" cy="15" rx="13" ry="10" fill="#d85835"/>
      <ellipse cx="41" cy="12" rx="12" ry="9" fill="#547d37"/>
      <ellipse cx="70" cy="19" rx="14" ry="10" fill="#e3af35"/>
      <ellipse cx="23" cy="42" rx="14" ry="10" fill="#9d572c"/>
      <ellipse cx="54" cy="43" rx="12" ry="9" fill="#c48b35"/>
      <ellipse cx="80" cy="52" rx="13" ry="10" fill="#6a843e"/>
      <ellipse cx="9" cy="69" rx="12" ry="9" fill="#dfa23a"/>
      <ellipse cx="44" cy="70" rx="14" ry="10" fill="#c95038"/>
      <ellipse cx="69" cy="74" rx="11" ry="8" fill="#82603b"/>
      <g fill="#fff" opacity=".22"><ellipse cx="11" cy="12" rx="4" ry="2"/><ellipse cx="38" cy="9" rx="4" ry="2"/><ellipse cx="66" cy="16" rx="4" ry="2"/><ellipse cx="20" cy="39" rx="4" ry="2"/><ellipse cx="51" cy="40" rx="4" ry="2"/></g>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#background)"/>
  <path d="M0 90C210 12 354 115 558 58s399-50 642 40V0H0Z" fill="#fff5dc" opacity=".36"/>
  <ellipse cx="600" cy="420" rx="387" ry="282" fill="url(#bowl)" filter="url(#shadow)"/>
  <ellipse cx="600" cy="404" rx="332" ry="232" fill="#80502e"/>
  <ellipse cx="600" cy="396" rx="313" ry="215" fill="url(#lentils)"/>
  <ellipse cx="600" cy="396" rx="313" ry="215" fill="none" stroke="#f8e4b9" stroke-width="18" opacity=".8"/>
  <g fill="#fff9e9" opacity=".65"><circle cx="286" cy="183" r="7"/><circle cx="232" cy="611" r="5"/><circle cx="992" cy="199" r="8"/><circle cx="1040" cy="572" r="5"/><circle cx="168" cy="386" r="6"/></g>
</svg>
